admin:
  access_log_path: "/dev/null"
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 8000

static_resources:
  listeners:
    - name: main
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 10000
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                codec_type: auto
                http_filters:
                  - name: envoy.filters.http.golang
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.golang.v3alpha.Config
                      library_id: ratelimit
                      library_path: "/filter.so"
                      plugin_name: ratelimit
                      plugin_config:
                        "@type": type.googleapis.com/xds.type.v3.TypedStruct
                        value:
                          default:
                            limit: 5
                            interval: "60s"
                            bucket_key: "x-api-key"
                          rules:
                            legacy:
                              limit: 1
                              interval: "60s"
                              bucket_key: "x-api-key"
                              match_headers:
                                - name: "x-plan"
                                  exact: "legacy"
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: local_service
                      domains: ["*"]
                      routes:
                        - name: premium-route
                          match:
                            prefix: "/premium"
                          direct_response:
                            status: 200
                            body:
                              inline_string: "premium-ok"
                          typed_per_filter_config:
                            envoy.filters.http.golang:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.golang.v3alpha.ConfigsPerRoute
                              plugins_config:
                                ratelimit:
                                  config:
                                    "@type": type.googleapis.com/xds.type.v3.TypedStruct
                                    value:
                                      default:
                                        limit: 2
                                        interval: "60s"
                                        bucket_key: "x-api-key"
                                      rules:
                                        tenant:
                                          limit: 1
                                          interval: "60s"
                                          bucket_key: "x-tenant-id"
                        - name: global-route
                          match:
                            prefix: "/"
                          direct_response:
                            status: 200
                            body:
                              inline_string: "ok"
